name: AppleIPTV
options:
  bundleIdPrefix: me.jstephan
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  IPTV:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Support/iOS/Info.plist
      properties:
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.jstephan.iptv
        TARGETED_DEVICE_FAMILY: "1,2"

  IPTV-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Support/macOS/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Support/macOS/IPTV.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.jstephan.iptv

  IPTV-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Sources
    info:
      path: Support/tvOS/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.jstephan.iptv
