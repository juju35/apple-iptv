name: AppleIPTV
options:
  bundleIdPrefix: me.jstephan
  # Marks the project as checked against this Xcode version (LastUpgradeCheck),
  # which silences the "Update to recommended settings" warning.
  xcodeVersion: "27.1"
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Kept here so regenerating the project with xcodegen doesn't drop the signing team.
    DEVELOPMENT_TEAM: 7D9CMN8LDB
    ENABLE_USER_SCRIPT_SANDBOXING: true

packages:
  # VLCKit (LGPL 2.1) as a prebuilt xcframework for iOS, macOS and tvOS.
  # Used for containers AVFoundation can't play (MKV, AVI, raw MPEG-TS…).
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: "3.6.0"

targets:
  IPTV:
    type: application
    platform: iOS
    # Explicit schemes so xcodegen writes shared schemes instead of relying on Xcode auto-creation.
    scheme: {}
    sources:
      - path: Sources
    dependencies:
      - package: VLCKitSPM
    info:
      path: Support/iOS/Info.plist
      properties:
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # iPad multitasking requires all four orientations unless the app is full-screen only.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
    entitlements:
      path: Support/iOS/IPTV.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.jstephan.iptv
        TARGETED_DEVICE_FAMILY: "1,2"

  IPTV-macOS:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: Sources
    dependencies:
      - package: VLCKitSPM
    info:
      path: Support/macOS/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Support/macOS/IPTV.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.jstephan.iptv

  IPTV-tvOS:
    type: application
    platform: tvOS
    scheme: {}
    sources:
      - path: Sources
    dependencies:
      - package: VLCKitSPM
    info:
      path: Support/tvOS/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Support/tvOS/IPTV.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.jstephan.iptv
