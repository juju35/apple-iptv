name: Release

# Publishes a GitHub release whenever main carries a version that has no tag yet: bump MARKETING_VERSION in
# project.yml, add its CHANGELOG.md section, push, and the release follows. The build number is the commit count.
#
# The release carries an iOS simulator build (xcrun simctl install booted IPTV.app) and an ad-hoc signed macOS app.
# With an App Store Connect API key in the secrets APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and
# APP_STORE_CONNECT_KEY (the .p8 file's content) and the APPLE_TEAM_ID variable, the iOS, tvOS and macOS apps are
# also archived, signed by Xcode (cloud signing) and uploaded to App Store Connect for TestFlight.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      testflight:
        description: Archive and upload this version to App Store Connect again, even if its GitHub release exists (after a failed upload)
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Xcode 27 runner image: 27.1 carries the iOS 27.1 SDK (iPhone Duo).
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    # The App Store Connect key only reaches the upload step: not brew, xcodegen or third-party actions.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        env:
          HAS_KEY: ${{ secrets.APP_STORE_CONNECT_KEY != '' }}
        run: |
          VERSION="$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' project.yml)"
          test -n "$VERSION"
          grep -q "^## $VERSION$" CHANGELOG.md || { echo "::error::No CHANGELOG.md section for $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" = "true" ]; then echo "upload=true" >> "$GITHUB_OUTPUT"; else echo "upload=false" >> "$GITHUB_OUTPUT"; fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the project
        if: steps.version.outputs.exists == 'false' || inputs.testflight
        run: |
          brew install xcodegen xcbeautify
          xcodegen

      - name: Release builds
        if: steps.version.outputs.exists == 'false'
        run: |
          set -o pipefail
          version="${{ steps.version.outputs.version }}"
          build="${{ steps.version.outputs.build }}"
          xcodebuild build -project AppleIPTV.xcodeproj -scheme IPTV -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CURRENT_PROJECT_VERSION="$build" CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
          ditto -c -k --keepParent build/sim/Build/Products/Release-iphonesimulator/IPTV.app \
            "apple-iptv-$version-ios-simulator.zip"
          # Ad-hoc signed: right-click › Open the first time (not notarized).
          xcodebuild build -project AppleIPTV.xcodeproj -scheme IPTV-macOS -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/mac \
            CURRENT_PROJECT_VERSION="$build" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            | xcbeautify --renderer github-actions
          ditto -c -k --keepParent build/mac/Build/Products/Release/IPTV.app \
            "apple-iptv-$version-macos.zip"
          .github/scripts/release-notes.sh "$version" > notes.md
          test -s notes.md

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            apple-iptv-${{ steps.version.outputs.version }}-ios-simulator.zip
            apple-iptv-${{ steps.version.outputs.version }}-macos.zip
          body_path: notes.md
          make_latest: true

      - name: Upload to App Store Connect
        if: (steps.version.outputs.exists == 'false' || inputs.testflight) && steps.version.outputs.upload == 'true'
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$TEAM_ID" ]; then
            echo "::error::APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and the APPLE_TEAM_ID variable are needed too"
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          # Readable by this user only, and gone when the step ends, whatever happens.
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$ASC_KEY" > "$key")
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
                -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")

          /usr/libexec/PlistBuddy -c "Clear dict" \
            -c "Add :method string app-store-connect" -c "Add :destination string upload" \
            -c "Add :teamID string $TEAM_ID" -c "Add :signingStyle string automatic" \
            -c "Add :uploadSymbols bool true" -c "Add :manageAppVersionAndBuildNumber bool false" \
            "$RUNNER_TEMP/ExportOptions.plist"

          # One app record (me.jstephan.iptv) with an iOS, a tvOS and a macOS build.
          for target in "IPTV:iOS" "IPTV-tvOS:tvOS" "IPTV-macOS:macOS"; do
            scheme="${target%%:*}"
            platform="${target##*:}"
            echo "::group::$platform"
            xcodebuild archive -project AppleIPTV.xcodeproj -scheme "$scheme" -configuration Release \
              -destination "generic/platform=$platform" -archivePath "build/$scheme.xcarchive" \
              DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
              "${auth[@]}" | xcbeautify --renderer github-actions
            xcodebuild -exportArchive -archivePath "build/$scheme.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "build/export-$scheme" \
              "${auth[@]}" | xcbeautify --renderer github-actions
            echo "::endgroup::"
            echo "::notice::$platform build ${{ steps.version.outputs.build }} of ${{ steps.version.outputs.version }} sent to App Store Connect (TestFlight after processing)"
          done

      - name: No App Store Connect key
        if: steps.version.outputs.exists == 'false' && steps.version.outputs.upload != 'true'
        run: echo "::warning::No App Store Connect key in the secrets, GitHub release only (nothing sent to TestFlight)"
