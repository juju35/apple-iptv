name: Extract strings (temporary)
on:
  push:
    branches: [l10n-extract]
permissions:
  contents: write
jobs:
  extract:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - run: |
          brew install xcodegen
          xcodegen
          for scheme in IPTV IPTV-tvOS IPTV-macOS; do
            case $scheme in IPTV) sdk=iphonesimulator;; IPTV-tvOS) sdk=appletvsimulator;; *) sdk=macosx;; esac
            xcodebuild -exportLocalizations -project AppleIPTV.xcodeproj -scheme "$scheme" -sdk "$sdk" \
              -localizationPath "out/$scheme" -exportLanguage en CODE_SIGNING_ALLOWED=NO > "log-$scheme.txt" 2>&1 || true
          done
          mkdir -p l10n
          for scheme in IPTV IPTV-tvOS IPTV-macOS; do tail -60 "log-$scheme.txt" > "l10n/log-$scheme.txt"; done
          find out -maxdepth 4 | head -50 > l10n/tree.txt
          for scheme in IPTV IPTV-tvOS IPTV-macOS; do
            find "out/$scheme" -name '*.xliff' -exec cp {} "l10n/$scheme.xliff" \; || true
          done
          ls -la l10n
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add l10n
          git commit -m "Extracted strings" || true
          git push origin HEAD:l10n-extract
