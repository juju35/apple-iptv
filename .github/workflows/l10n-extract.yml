name: Extract strings (temporary)
on:
  push:
    branches: [l10n-extract]
permissions:
  contents: write
jobs:
  extract:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages pyyaml
          mkdir -p l10n
          # One project per target: -exportLocalizations builds every target for one SDK, and the three apps
          # share their product name.
          for target in IPTV IPTV-tvOS IPTV-macOS; do
            python3 - "$target" <<'PY'
          import sys, yaml
          target = sys.argv[1]
          spec = yaml.safe_load(open("project.yml"))
          spec["targets"] = {target: spec["targets"][target]}
          spec["name"] = "Extract"
          yaml.safe_dump(spec, open("extract.yml", "w"))
          PY
            xcodegen --spec extract.yml --quiet
            xcodebuild -exportLocalizations -project Extract.xcodeproj -localizationPath "out/$target" \
              -exportLanguage en CODE_SIGNING_ALLOWED=NO > "l10n/log-$target.txt" 2>&1 || true
            tail -15 "l10n/log-$target.txt"
            find "out/$target" -name '*.xliff' -exec cp {} "l10n/$target.xliff" \; || true
            rm -rf Extract.xcodeproj
          done
          ls -la l10n
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add l10n
          git commit -m "Extracted strings" || true
          git push origin HEAD:l10n-extract
