included:
  - Sources
line_length:
  warning: 140
  error: 180
  ignores_urls: true
  ignores_comments: true
identifier_name:
  excluded: [id, js, p, h, m, s, ep, kvs, i, d, ch]
type_body_length:
  warning: 300
file_length:
  warning: 500
function_body_length:
  warning: 60
cyclomatic_complexity:
  warning: 12
nesting:
  type_level: 2
opt_in_rules:
  - empty_count
  - first_where
  - last_where
  - sorted_first_last
  - closure_spacing
  - redundant_nil_coalescing
  - toggle_bool
  - modifier_order
# `swiftlint analyze` (scripts/dead-code.sh): unused code, from a compiler log.
analyzer_rules:
  - unused_declaration
  - unused_import
unused_declaration:
  include_public_and_open: false
disabled_rules:
  - todo
  # Trailing commas keep diffs to one line.
  - trailing_comma
